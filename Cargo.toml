[package]
name = "wheye"
version = "0.1.26"
edition = "2021"
authors = ["Jos De Roo"]
license = "MIT"
description = "A small relational reasoner with independently checked proof certificates."
default-run = "wheye"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[[bench]]
name = "taxonomy"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
