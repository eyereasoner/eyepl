[package]
name = "eyepl"
version = "0.3.7"
edition = "2021"
authors = ["Jos De Roo"]
license = "MIT"
description = "An eyepl reasoner with independently checked proof certificates."
repository = "https://github.com/eyereasoner/eyepl"
homepage = "https://eyereasoner.github.io/eyepl/"
readme = "README.md"
keywords = ["reasoner", "datalog", "prolog", "proof", "logic"]
categories = ["science", "command-line-utilities", "wasm"]
default-run = "eyepl"
# The crate carries the library, CLI, and contract documents; examples, tests,
# the browser package, and the website stay in the repository.
include = ["/src/", "/README.md", "/GUIDE.md", "/SPEC.md", "/LICENSE.md"]

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[[bench]]
name = "taxonomy"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
