name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, such as v0.3.3'
        required: true
        type: string
      dry_run:
        description: 'Verify the package without publishing'
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: crates-io-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open('Cargo.toml', 'rb') as source:
              package = tomllib.load(source)['package']
          expected = f"v{package['version']}"
          if package['name'] != 'eyepl' or os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Publish requires the eyepl release tag {expected}.')
          print(f"Publishing candidate: eyepl {package['version']}")
          PY

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify packaged crate
        run: cargo publish --dry-run --locked --registry crates-io

      # crates.io accepts eyepl versions only through this workflow's trusted
      # publisher, which exchanges the Actions identity for a short-lived token.
      - name: Authenticate with crates.io trusted publishing
        if: ${{ !inputs.dry_run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io
